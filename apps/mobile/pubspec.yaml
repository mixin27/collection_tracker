name: collection_tracker
description: "Collection tracking mobile app"
publish_to: 'none'
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  go_router: ^17.0.1

  flutter_riverpod: ^3.2.0
  riverpod_annotation: ^4.0.1

  # HTTP
  dio: ^5.9.0

  # UI
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.2

  # Firebase
  firebase_core: ^4.4.0
  firebase_analytics: ^12.1.2
  firebase_crashlytics: ^5.0.7

  # Local workspace packages
  domain:
    path: ../../packages/core/domain
  data:
    path: ../../packages/core/data
  ui:
    path: ../../packages/common/ui
  utils:
    path: ../../packages/common/utils
  database:
    path: ../../packages/integrations/database
  barcode_scanner:
    path: ../../packages/integrations/barcode_scanner
  storage:
    path: ../../packages/integrations/storage
  metadata_api:
    path: ../../packages/integrations/metadata_api
  common_env:
    path: ../../packages/common/env
  app_logger:
    path: ../../packages/integrations/logger
  app_analytics:
    path: ../../packages/integrations/analytics
  app_firebase:
    path: ../../packages/integrations/firebase_services
  sync_api:
    path: ../../packages/integrations/sync_api

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.5
  riverpod_generator: ^4.0.2
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/
  # fonts:
